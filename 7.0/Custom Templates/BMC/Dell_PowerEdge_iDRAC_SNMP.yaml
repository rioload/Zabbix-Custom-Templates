zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: de110000000040008000000000000000
      name: 'Custom Templates/BMC'
  templates:
    - uuid: de110000000040008000000000000001
      template: 'Dell_PowerEdge_iDRAC_SNMP'
      name: 'Dell PowerEdge iDRAC SNMP'
      description: '通用終極版：已賦予全新序列化 UUIDv4 (de11...)，徹底解決匯入衝突。適用於 iDRAC 7/8。整合硬碟、RAID、預測故障、電源與全機狀態。'
      groups:
        - name: 'Custom Templates/BMC'
      items:
        - uuid: de110000000040008000000000000002
          name: '系統：全機健康狀態'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.674.10892.5.2.1.0
          key: system.status.global
          delay: 1m
          value_type: FLOAT
          valuemap:
            name: 'Dell 物件狀態碼'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: de110000000040008000000000000003
              expression: 'last(/Dell_PowerEdge_iDRAC_SNMP/system.status.global)>3'
              name: '系統：全機健康狀態異常'
              priority: HIGH
        - uuid: de110000000040008000000000000004
          name: '系統：設備型號'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.674.10892.5.1.3.12.0
          key: system.hw.model
          delay: 1h
          value_type: CHAR
          tags:
            - tag: component
              value: inventory
        - uuid: de110000000040008000000000000005
          name: '系統：服務編號 (Service Tag)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.674.10892.5.1.3.2.0
          key: system.hw.serial
          delay: 1h
          value_type: CHAR
          tags:
            - tag: component
              value: inventory
        - uuid: de110000000040008000000000000006
          name: '系統：韌體版本'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.674.10892.5.1.1.8.0
          key: system.hw.firmware
          delay: 1h
          value_type: CHAR
          tags:
            - tag: component
              value: inventory

      discovery_rules:
        - uuid: de110000000040008000000000000007
          name: '實體硬碟自動發現'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#DISK_NAME},1.3.6.1.4.1.674.10892.5.5.1.20.130.4.1.2]'
          key: physicaldisk.discovery
          delay: 1h
          item_prototypes:
            - uuid: de110000000040008000000000000008
              name: '硬碟 {#DISK_NAME}：狀態'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.674.10892.5.5.1.20.130.4.1.24.{#SNMPINDEX}'
              key: 'disk.phys.status[{#SNMPINDEX}]'
              value_type: FLOAT
              valuemap:
                name: 'Dell 物件狀態碼'
              trigger_prototypes:
                - uuid: de110000000040008000000000000009
                  expression: 'last(/Dell_PowerEdge_iDRAC_SNMP/disk.phys.status[{#SNMPINDEX}])>3'
                  name: '儲存：實體硬碟 {#DISK_NAME} 狀態異常'
                  priority: HIGH
            - uuid: de11000000004000800000000000000a
              name: '硬碟 {#DISK_NAME}：SMART 預測性故障狀態'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.674.10892.5.5.1.20.130.4.1.31.{#SNMPINDEX}'
              key: 'disk.phys.smart[{#SNMPINDEX}]'
              value_type: FLOAT
              valuemap:
                name: 'Dell SMART 狀態'
              trigger_prototypes:
                - uuid: de11000000004000800000000000000b
                  expression: 'last(/Dell_PowerEdge_iDRAC_SNMP/disk.phys.smart[{#SNMPINDEX}])=1'
                  name: '儲存：硬碟 {#DISK_NAME} 預測性故障 (SMART Alert)'
                  priority: HIGH

        - uuid: de11000000004000800000000000000c
          name: '虛擬磁碟自動發現'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#VDISK_NAME},1.3.6.1.4.1.674.10892.5.5.1.20.140.1.1.2]'
          key: virtualdisk.discovery
          delay: 1h
          item_prototypes:
            - uuid: de11000000004000800000000000000d
              name: '虛擬磁碟 {#VDISK_NAME}：狀態'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.674.10892.5.5.1.20.140.1.1.4.{#SNMPINDEX}'
              key: 'disk.virt.status[{#SNMPINDEX}]'
              value_type: FLOAT
              valuemap:
                name: 'Dell 物件狀態碼'
              trigger_prototypes:
                - uuid: de11000000004000800000000000000e
                  expression: 'last(/Dell_PowerEdge_iDRAC_SNMP/disk.virt.status[{#SNMPINDEX}])>3'
                  name: '儲存：虛擬磁碟 {#VDISK_NAME} 降級或失敗'
                  priority: HIGH

        - uuid: de11000000004000800000000000000f
          name: '電源供應器自動發現'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#PSU_NAME},1.3.6.1.4.1.674.10892.5.4.600.12.1.8]'
          key: psu.discovery
          delay: 1h
          item_prototypes:
            - uuid: de110000000040008000000000000010
              name: '電源 {#PSU_NAME}：狀態'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.674.10892.5.4.600.12.1.5.{#SNMPINDEX}'
              key: 'psu.status[{#SNMPINDEX}]'
              value_type: FLOAT
              valuemap:
                name: 'Dell 物件狀態碼'
              trigger_prototypes:
                - uuid: de110000000040008000000000000011
                  expression: 'last(/Dell_PowerEdge_iDRAC_SNMP/psu.status[{#SNMPINDEX}])>3'
                  name: '電源：電源供應器 {#PSU_NAME} 異常'
                  priority: HIGH

      valuemaps:
        - uuid: de110000000040008000000000000012
          name: 'Dell 物件狀態碼'
          mappings:
            - value: '3'
              newvalue: OK
            - value: '4'
              newvalue: Non-Critical (警告)
            - value: '5'
              newvalue: Critical (嚴重)
            - value: '6'
              newvalue: Non-Recoverable (災難)
        - uuid: de110000000040008000000000000013
          name: 'Dell SMART 狀態'
          mappings:
            - value: '0'
              newvalue: OK
            - value: '1'
              newvalue: 預測性故障 (Failed)